# capability_reference.yaml
# What Google Photos search can use today, per cue type.
# Source: hands-on testing by the PM on her own device and library (September 2026).
# searchable = overall judgment used for gap scoring: yes | partial | no | not_verified
# search / ask_photos = raw results from each surface, as recorded by the tester.
# Caveat: some failures may be partly caused by photos not being backed up to Google Photos.

verified_how: "Hands-on test on the PM's own Android device and Google Photos library, regular search and Ask Photos, one target photo per cue"
verified_at: "2026-09"

cues:
  time_absolute:
    searchable: partial
    search: partial
    ask_photos: partial
    note: "'March 2024' returned only one photo (shoes). Date search works but recall was very low; possible backup gaps."

  time_season:
    searchable: partial
    search: partial
    ask_photos: partial
    note: "'Diwali' returned festival photos mixed with birthdays (sparklers), weddings and traditional attire. Recognizes the look of a festival, not the occasion itself. Ask Photos narrower (19 vs 68) but also confused Diwali with Dussehra."

  time_event_anchor:
    searchable: partial
    search: partial
    ask_photos: partial
    note: "Tester rated yes: 'after my trip' returned mostly trip photos. Adjusted to partial because results matched the concept 'trip', not the relation 'after'. Photos taken after the trip were not what came back."

  place_named:
    searchable: yes
    search: yes
    ask_photos: yes
    note: "'Pune' returned 2019 photos correctly. Recent Pune photos missing because they were not backed up."

  person_named:
    searchable: yes
    search: yes
    ask_photos: yes
    note: "Face recognized perfectly, 60+ photos. Requires the person to be labeled in Photos first (setup)."

  subject_object:
    searchable: partial
    search: partial
    ask_photos: partial
    note: "Tester rated yes. Adjusted to partial: common objects work ('car' 9 results with one false positive; 'cake' returned birthday photos), but 'medicine' returned nothing despite medicine and prescription photos on the device (possibly not backed up)."

  text_in_image:
    searchable: yes
    search: yes
    ask_photos: yes
    note: "Laptop receipt and barcode found; 'sign' returned signs, restaurant and ad boards. Caveat: the receipt had a caption added by the tester, which may have helped."

  source_sender:
    searchable: "no"
    search: "no"
    ask_photos: "no"
    note: "'photo sent by Pooja on WhatsApp': regular search returned nothing. Ask Photos returned photos OF Pooja, not photos sent BY her. It reads the sender as the subject. (Tester recorded Ask Photos as partial; adjusted to no because no sent photos were returned.)"

  personal_state:
    searchable: "no"
    search: "no"
    ask_photos: "no"
    note: "'when I was sick' returned nothing on either surface."

  purpose_use:
    searchable: partial
    search: partial
    ask_photos: partial
    note: "'insurance' and 'prescription' returned an offer letter containing the words 'medical allowance'; 'ID card' returned bills and an exam admission card. Matches words in the image, not the purpose of the document."

  # Not tested: excluded from gap ranking until verified
  time_life_stage: {searchable: not_verified}
  place_type: {searchable: not_verified}
  person_relation: {searchable: not_verified}
  group_social: {searchable: not_verified}
  scene_activity: {searchable: not_verified}
  conversation_context: {searchable: not_verified}
  emotional_tone: {searchable: not_verified}
  adjacency: {searchable: not_verified}